services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file: .env
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  kumomta:
    image: ghcr.io/kumocorp/kumomta:latest
    ports:
      - "2525:25"
      - "8000:8000"
    volumes:
      - ./kumomta-config:/opt/kumomta/etc/policy
      - ./data/kumomta-data:/var/spool/kumomta/data
      - ./data/kumomta-meta:/var/spool/kumomta/meta
      - ./data/kumomta-logs:/var/log/kumomta
      - ./data/kumomta-dkim:/opt/kumomta/etc/dkim
    environment:
      - KUMO_POLICY=/opt/kumomta/etc/policy/init.lua
    restart: unless-stopped
    user: "0:0"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kumomta:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    env_file: .env
    volumes:
      - ./data:/app/data
    entrypoint: []
    command: celery worker --app=colossus --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kumomta:
        condition: service_started
    restart: unless-stopped

  beat:
    build:
      context: .
    env_file: .env
    volumes:
      - ./data:/app/data
    entrypoint: []
    command: celery beat --app=colossus --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kumomta:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
